actions:
  # Drag and drop
  drag_left:
    label: "action.drag_left.label"
    states:
      - area
      - world
    save_mouse: true
    drag:
      type: ab
      from:
        x: 80px
        y: center
      to:
        x: -80px
        y: center
      duration: 0.5
  drag_right:
    label: "action.drag_right.label"
    states:
      - area
      - world
    save_mouse: true
    drag:
      type: ab
      from:
        x: -80px
        y: center
      to:
        x: 80px
        y: center
      duration: 0.5
  drag_up:
    label: "action.drag_up.label"
    states:
      - area
      - world
    save_mouse: true
    drag:
      type: ab
      from:
        x: center
        y: 10px
      to:
        x: center
        y: -110px
      duration: 0.5
  drag_down:
    label: "action.drag_down.label"
    states:
      - area
      - world
    save_mouse: true
    drag:
      type: ab
      from:
        x: center
        y: -110px
      to:
        x: center
        y: 10px
      duration: 0.5

